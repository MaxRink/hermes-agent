# Dependency updates are reviewed as pull requests; exact pins remain in manifests and lockfiles.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      # Batch routine action bumps into one PR per week to reduce noise.
      # Security updates still open individually and bypass grouping.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: cargo
    directory: /apps/bootstrap-installer/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker
    directories:
    - /
    - /docker
    - /scripts/termux
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directories:
    - /.github/actions/check-clean-worktree
    - /.github/actions/desktop-build-cache
    - /.github/actions/detect-changes
    - /.github/actions/e2e-screen-record
    - /.github/actions/get-app-token
    - /.github/actions/nix-setup
    - /.github/actions/plugin-validate
    - /.github/actions/retry
    - /.github/actions/save-pm-cache
    - /.github/actions/setup-pm
    - /.github/actions/setup-pm/prune
    - /.github/actions/setup-windows-build-deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: pip
    directories:
    - /hermes_cli
    - /hermes_cli/subcommands
    - /optional-skills/finance/dcf-model
    - /skills/productivity/google-workspace/scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
  - package-ecosystem: uv
    directories:
    - /
    - /pm
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch

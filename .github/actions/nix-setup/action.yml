name: 'Setup Nix'
description: 'Install Nix and configure Cachix binary cache'

inputs:
  cachix-auth-token:
    description: 'Cachix auth token (enables push). Omit for read-only.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
    - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
      with:
        name: hermes-agent
        authToken: ${{ inputs.cachix-auth-token }}
      continue-on-error: true
